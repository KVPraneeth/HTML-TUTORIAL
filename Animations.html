<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animations</title>
    <style>
      .animated {
        width: 100px;
        height: 100px;
        background-color: rgb(5, 9, 145);
        transition:
          width 2s,
          height 4s,
          border-radius 5s,
          background-color 5s;
      }
      .animated:hover {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <!-- Transitions and Animations
     transitions: propertyname, time, easing function, delay
     
     Animation:  -->

    <div class="animated"></div>
  </body>
</html>
