<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Box</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        padding: 0 20px 30px 0;
        line-height: 1.4;
      }

      .flex-container {
        display: flex;
        width: 100%;
        height: 500px;
        flex-wrap: wrap-reverse;
        border: 20px solid darkblue;
        /* flex-direction: column-reverse; */
        align-content: space-around;
      }
      .flex-item {
        background-color: lightblue;
        width: 75px;
        /* height: 75px; */
        border: 2px solid black;
        text-align: center;
        font-size: 2em;
        color: white;
        line-height: 1.4;
      }

      #flex-item-1 {
        background-color: pink;
        /* flex-grow: 2; */
        /* flex-shrink: 2; */
        align-self: stretch;
      }
      #flex-item-2 {
        background-color: rgb(37, 146, 62);
      }
      #flex-item-3 {
        background-color: rgb(164, 168, 53);
      }
      #flex-item-4 {
        background-color: rgb(244, 16, 183);
      }
      #flex-item-5 {
        background-color: rgb(26, 26, 131);
      }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <div class="flex-item" id="flex-item-1">1</div>
      <div class="flex-item" id="flex-item-2">2</div>
      <div class="flex-item" id="flex-item-3">3</div>
      <div class="flex-item" id="flex-item-4">4</div>
      <div class="flex-item" id="flex-item-5">5</div>
    </div>
  </body>
</html>
